<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TellMore AI</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #F7F5F7; color: #1a1a1a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .mark {
      width: 96px; height: 96px; border-radius: 22px; background: #7B1C3E;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 30px rgba(123, 28, 62, .25);
    }
    .mark svg { width: 52px; height: 52px; }
    .name { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
    .hint { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <!-- Shown only while the app is starting. Once it connects, the live
       TellMore AI web app (https://www.tellmoreai.com) takes over in this same
       WebView. This file exists so the Capacitor build has a web directory; it
       is never part of the Next.js/Vercel build. -->
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4.5 13.5H11l-1 8.5L19.5 10H13z"/></svg>
  </div>
  <div class="name">TellMore AI</div>
  <div class="hint">Loading…</div>
</body>
</html>

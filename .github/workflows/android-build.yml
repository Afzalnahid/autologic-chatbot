# Builds the TellMore AI Android app (a Capacitor WebView shell that loads the
# live web app) in the cloud, for free, and hands back an installable APK as a
# downloadable artifact. Manual trigger only ("Run workflow" button), so it does
# NOT run on ordinary pushes and never touches the Vercel web deploy.
#
# This produces a DEBUG-signed APK — installable by sideloading (share the file,
# enable "install unknown apps"), which is exactly what we want for testing and
# sharing before any store. A Play-Store / release-signed build is a later step
# (add a keystore in repo Secrets); see mobile/README.md.
name: Build Android APK

on:
  workflow_dispatch:

# The key step below may commit the signing key back to the repo (first run only).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (JDK 17, required by Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Android only installs a new build OVER an existing one when both carry
      # the SAME signature. A fresh build machine mints a new throwaway debug key
      # every run, so every rebuild used to fail on the phone with "App not
      # installed". The key now lives in the repo (mobile/debug.keystore — a
      # debug key, not a secret, standard Android practice) and is created here
      # once, then committed, so every build signs identically forever.
      - name: Stable signing key
        run: |
          if [ ! -f mobile/debug.keystore ]; then
            keytool -genkeypair -v -keystore mobile/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=getvoicium Debug, O=getvoicium, C=BD"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/debug.keystore
            git commit -m "mobile: stable debug signing key (generated once by CI)"
            git push
          fi
          mkdir -p ~/.android
          cp mobile/debug.keystore ~/.android/debug.keystore

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Build the brand icon + splash source images
        working-directory: mobile
        run: node scripts/gen-assets.mjs

      - name: Generate the Android project
        working-directory: mobile
        run: npx cap add android

      - name: Add Firebase config (enables FCM push)
        working-directory: mobile
        run: cp google-services.json android/app/google-services.json

      - name: Declare runtime permissions (notifications, camera, mic, location, photos)
        working-directory: mobile
        run: node scripts/patch-manifest.mjs

      - name: Apply the app icon and splash (crimson bolt, no border)
        working-directory: mobile
        run: npx capacitor-assets generate --android

      - name: Add the notification small icon (white bolt silhouette)
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/notif-icon.png android/app/src/main/res/drawable/ic_stat_notify.png

      - name: Sync web assets and config
        working-directory: mobile
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/android/app/build/outputs/apk/debug/tellmoreai.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: tellmoreai-android-apk
          path: mobile/android/app/build/outputs/apk/debug/tellmoreai.apk
          if-no-files-found: error

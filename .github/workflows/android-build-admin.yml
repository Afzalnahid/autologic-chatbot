# Builds the TellMore AI ADMIN Android app — a separate app from the one in
# android-build.yml, with its own package id (com.tellmoreai.admin), its own
# icon and its own notifications.
#
# Owner, 2026-09-24: "my native app which is for users automatically converted
# to admin app — the admin app and the user app will be separated. There will be
# two separated apps, one is for user where the user notification comes, and an
# admin app where the admin panel notifications come."
#
# Because the package ids differ, both apps install side by side on the same
# phone and neither replaces the other. Manual trigger only.
#
# The Firebase config for this package is committed
# (mobile-admin/google-services.json — project getvoicium, the same project the
# user app uses), so notifications work as soon as the app is installed and
# signed in. See mobile-admin/README.md.
name: Build Admin Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (JDK 17, required by Capacitor 6)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The same debug key as the user app. The two apps have different package
      # ids, so sharing a key cannot make one install over the other; what it
      # does give is the same guarantee for THIS app — every rebuild signs
      # identically, so an update installs over the previous one instead of
      # failing with "App not installed".
      - name: Reuse the stable signing key
        run: |
          if [ ! -f mobile/debug.keystore ]; then
            echo "::error::mobile/debug.keystore is missing. Run the user app's build once first — it creates and commits the key."
            exit 1
          fi
          mkdir -p ~/.android
          cp mobile/debug.keystore ~/.android/debug.keystore

      # The icon artwork is generated by the USER app's script and then coloured
      # differently below, so there is one drawing of the logo in this repo
      # rather than two that can drift apart.
      - name: Build the brand icon + splash source images
        working-directory: mobile
        run: |
          npm install
          node scripts/gen-assets.mjs

      # Everything except icon-background.png. gen-assets bakes the user app's
      # maroon gradient into that file, and @capacitor/assets prefers it over
      # --iconBackgroundColor — so leaving it out is what actually gives the
      # admin app the darker field below.
      - name: Give the admin app the same artwork, minus the background
        run: |
          mkdir -p mobile-admin/assets
          cp -r mobile/assets/. mobile-admin/assets/
          rm -f mobile-admin/assets/icon-background.png

      - name: Install Capacitor
        working-directory: mobile-admin
        run: npm install

      - name: Generate the Android project
        working-directory: mobile-admin
        run: npx cap add android

      # Fails rather than warns: the file is committed, so if it has gone the
      # build would quietly produce an app that can never be notified — which is
      # the whole point of this app.
      - name: Add Firebase config (enables FCM push)
        working-directory: mobile-admin
        run: |
          if [ ! -f google-services.json ]; then
            echo "::error::mobile-admin/google-services.json is missing. Without it the admin app cannot receive notifications. See mobile-admin/README.md."
            exit 1
          fi
          grep -q '"package_name": "com.tellmoreai.admin"' google-services.json || {
            echo "::error::google-services.json does not list com.tellmoreai.admin — wrong file, or the app was registered under another package name."
            exit 1
          }
          cp google-services.json android/app/google-services.json

      # tellmoreai-admin:// rather than tellmoreai://. Two apps claiming one
      # scheme makes Android ask which to open, every single time.
      - name: Patch the Android project
        working-directory: mobile-admin
        env:
          TM_APP_SCHEME: tellmoreai-admin
        run: node ../mobile/scripts/patch-manifest.mjs

      # The DEEP shade of the brand maroon (#5C1430 against the user app's
      # #7B1C3E), so the two icons are told apart at a glance on the home screen
      # while still reading as one product.
      - name: Apply the app icon and splash
        working-directory: mobile-admin
        run: >-
          npx capacitor-assets generate --android
          --iconBackgroundColor '#5C1430' --iconBackgroundColorDark '#5C1430'
          --splashBackgroundColor '#FCFCFD' --splashBackgroundColorDark '#0B0B0E'

      - name: Add the notification small icon
        working-directory: mobile-admin
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/notif-icon.png android/app/src/main/res/drawable/ic_stat_notify.png

      - name: Sync web assets and config
        working-directory: mobile-admin
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: mobile-admin/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the file
        run: cp mobile-admin/android/app/build/outputs/apk/debug/app-debug.apk mobile-admin/android/app/build/outputs/apk/debug/tellmoreai-admin.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: tellmoreai-admin-android-apk
          path: mobile-admin/android/app/build/outputs/apk/debug/tellmoreai-admin.apk
          if-no-files-found: error

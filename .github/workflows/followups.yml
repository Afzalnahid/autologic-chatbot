name: Send due follow-ups

# Follow-ups must go out inside Meta's 24-hour window, so they have to be
# checked through the day. Vercel's Hobby plan allows a cron only once a day,
# so GitHub calls the endpoint instead. Cost: nothing — this repository is
# PUBLIC, and GitHub Actions is free without a minute limit on public
# repositories. (An older comment here counted 1,440 of 2,000 free minutes a
# month against a private repository; that was wrong about the repository.)
# Move this into vercel.json (and delete this file) once the project is on
# Vercel Pro, which allows frequent crons.
# The endpoint itself decides who is due; calling it early or twice is harmless.
#
# Add a repository secret CRON_SECRET with the SAME value as the CRON_SECRET
# environment variable on Vercel. Since 2026-09-24 that variable IS set, so the
# endpoint answers 401 without it and no follow-up goes out.
#
# The url must be the www host. The apex tellmoreai.com answers 308 and points
# at www, curl does not follow a redirect unless told to, and even with -L it
# drops the Authorization header when the host changes. Calling the apex is what
# broke this job silently: every run from the day the redirect appeared returned
# 308, failed the status check, and sent nothing (found 2026-09-24).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the follow-up endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::The repository secret CRON_SECRET is not set. Vercel has the variable, so the endpoint will answer 401 and no follow-up will be sent. Add the same value under Settings → Secrets and variables → Actions."
            exit 1
          fi
          code=$(curl -sS -o body.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" --max-time 90 https://www.tellmoreai.com/api/cron/followups)
          cat body.json; echo
          if [ "$code" = "401" ]; then
            echo "::error::401 — the repository secret CRON_SECRET does not match the one on Vercel."
            exit 1
          fi
          test "$code" = "200"

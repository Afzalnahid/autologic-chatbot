<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="A shop owner's messages being answered automatically">
  <!-- Drawn from scratch. The reference's illustrations are its own; what is borrowed
       here is the language — flat duotone, hard edges, one accent — not the artwork. -->
  <defs>
    <clipPath id="frame"><rect width="900" height="620"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="620" fill="#E9E0CC"/>

    <!-- back wall, shelving -->
    <rect x="0" y="0" width="900" height="360" fill="#5B8CFF" opacity="0.16"/>
    <g fill="#2447C9" opacity="0.9">
      <rect x="60" y="70" width="250" height="12"/>
      <rect x="60" y="170" width="250" height="12"/>
      <rect x="60" y="270" width="250" height="12"/>
    </g>
    <g fill="#2447C9">
      <rect x="78" y="26" width="46" height="44"/><rect x="136" y="34" width="34" height="36"/>
      <rect x="182" y="20" width="40" height="50"/><rect x="234" y="38" width="52" height="32"/>
      <rect x="72" y="126" width="38" height="44"/><rect x="122" y="134" width="48" height="36"/>
      <rect x="182" y="120" width="34" height="50"/><rect x="228" y="140" width="58" height="30"/>
      <rect x="90" y="228" width="52" height="42"/><rect x="154" y="236" width="36" height="34"/>
      <rect x="202" y="222" width="44" height="48"/>
    </g>
    <g fill="#E9E0CC" opacity="0.55">
      <rect x="86" y="34" width="30" height="6"/><rect x="190" y="30" width="24" height="6"/>
      <rect x="80" y="134" width="22" height="6"/><rect x="236" y="150" width="42" height="6"/>
      <rect x="98" y="238" width="36" height="6"/>
    </g>

    <!-- window, city beyond -->
    <rect x="600" y="40" width="250" height="230" fill="#E9E0CC"/>
    <rect x="600" y="40" width="250" height="230" fill="none" stroke="#2447C9" stroke-width="7"/>
    <g fill="#5B8CFF" opacity="0.55">
      <rect x="618" y="150" width="34" height="120"/><rect x="662" y="110" width="28" height="160"/>
      <rect x="700" y="170" width="40" height="100"/><rect x="750" y="126" width="30" height="144"/>
      <rect x="790" y="186" width="44" height="84"/>
    </g>
    <line x1="725" y1="40" x2="725" y2="270" stroke="#2447C9" stroke-width="5"/>

    <!-- counter -->
    <rect x="0" y="392" width="900" height="34" fill="#2447C9"/>
    <rect x="0" y="426" width="900" height="194" fill="#5B8CFF" opacity="0.28"/>
    <g stroke="#2447C9" stroke-width="3" opacity="0.5">
      <line x1="120" y1="426" x2="120" y2="620"/><line x1="360" y1="426" x2="360" y2="620"/>
      <line x1="600" y1="426" x2="600" y2="620"/><line x1="840" y1="426" x2="840" y2="620"/>
    </g>

    <!-- the shopkeeper -->
    <g>
      <path d="M372 392c0-58 26-96 66-96s66 38 66 96z" fill="#2447C9"/>
      <circle cx="438" cy="252" r="40" fill="#2447C9"/>
      <path d="M400 246c0-26 17-44 38-44s38 18 38 44c0-14-16-20-38-20s-38 6-38 20z" fill="#14171F"/>
      <rect x="398" y="330" width="80" height="52" rx="8" fill="#E9E0CC"/>
      <rect x="408" y="340" width="60" height="32" rx="4" fill="#5B8CFF"/>
      <path d="M372 392c-6-40 4-66 22-74l14 30z" fill="#5B8CFF"/>
      <path d="M504 392c6-40-4-66-22-74l-14 30z" fill="#5B8CFF"/>
    </g>

    <!-- messages arriving -->
    <g>
      <rect x="120" y="70" width="150" height="52" rx="14" fill="#FFF" opacity="0"/>
      <g transform="translate(560,300)">
        <rect x="0" y="0" width="180" height="46" rx="16" fill="#14171F"/>
        <rect x="18" y="16" width="96" height="7" rx="3.5" fill="#E9E0CC" opacity="0.85"/>
        <rect x="18" y="29" width="62" height="7" rx="3.5" fill="#E9E0CC" opacity="0.45"/>
      </g>
      <g transform="translate(632,214)">
        <rect x="0" y="0" width="200" height="46" rx="16" fill="#E85A2A"/>
        <rect x="18" y="16" width="120" height="7" rx="3.5" fill="#FFF" opacity="0.9"/>
        <rect x="18" y="29" width="74" height="7" rx="3.5" fill="#FFF" opacity="0.55"/>
      </g>
      <g transform="translate(190,320)">
        <rect x="0" y="0" width="164" height="46" rx="16" fill="#14171F"/>
        <rect x="18" y="16" width="84" height="7" rx="3.5" fill="#E9E0CC" opacity="0.85"/>
        <rect x="18" y="29" width="52" height="7" rx="3.5" fill="#E9E0CC" opacity="0.45"/>
      </g>
    </g>

    <!-- drafting marks, the way the reference treats its frame -->
    <g stroke="#14171F" stroke-width="2" opacity="0.45" fill="none">
      <path d="M24 16v18M16 24h18"/>
      <path d="M876 586v18M866 596h18"/>
    </g>
  </g>
</svg>

<!doctype html>
<html><head><meta charset="utf-8"><title>scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Fraunces:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--cr:#D92632;--deep:#B01824;--mint:#2ED3A7;--ink:#17171B;--mut:#5B6070;--dim:#8A90A0;--bg:#EEF0F5;--card:#FFFFFF;--line:#DDE1EA;--blue:#1B6DF2;--ok:#1E9E6A;--warn:#D98B0B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,"Hind Siliguri",system-ui,sans-serif;color:var(--ink)}
body.bn{font-family:"Hind Siliguri",Inter,system-ui,sans-serif}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;opacity:0;transition:opacity .6s ease}
#stage.in{opacity:1}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;pointer-events:none}
.b1{width:900px;height:900px;background:var(--cr);right:-320px;top:-380px}
.b2{width:700px;height:700px;background:#9DB3FF;left:-300px;bottom:-380px;opacity:.22}
.brand{position:absolute;left:96px;top:64px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#E12F3E,#B01824);display:flex;align-items:center;justify-content:center}
.brand .ic svg{width:30px;height:30px}
.brand .name{font-family:Fraunces,Georgia,serif}
.left{position:absolute;left:96px;top:300px;width:700px}
.title{font-size:64px;line-height:1.08;font-weight:800;letter-spacing:-.025em;color:var(--ink)}
body.bn .title{font-size:60px;line-height:1.2;letter-spacing:0;font-weight:700}
.title .w{display:inline-block;opacity:0;transform:translateY(28px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.title .w.show{opacity:1;transform:none}
.sub{margin-top:26px;font-size:26px;line-height:1.5;color:var(--mut);opacity:0;transform:translateY(14px);transition:all .6s ease}
.sub.show{opacity:1;transform:none}
.accent{width:84px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--cr),var(--deep));margin-bottom:26px;transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.accent.show{transform:scaleX(1)}
.progress{position:absolute;left:0;bottom:0;height:8px;width:1920px;background:rgba(0,0,0,.06)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cr),var(--deep))}
.right{position:absolute;left:880px;top:150px;width:960px;height:780px;display:flex;align-items:center;justify-content:center}
/* laptop */
.laptop{width:960px;transform:translateY(24px) scale(.96);opacity:0;transition:all .8s cubic-bezier(.2,.7,.2,1)}
.laptop.show{opacity:1;transform:none}
.screen{width:960px;height:600px;background:#0F1117;border-radius:22px 22px 6px 6px;padding:14px;box-shadow:0 40px 80px rgba(20,24,40,.25)}
.screen .inner{width:100%;height:100%;background:var(--bg);border-radius:12px;overflow:hidden;position:relative}
.base{width:1040px;height:22px;background:linear-gradient(#DDE1EA,#B9BFCC);border-radius:0 0 18px 18px;margin-left:-40px}
/* phone */
.phone{width:380px;height:780px;background:#0F1117;border-radius:52px;padding:14px;box-shadow:0 40px 80px rgba(20,24,40,.28);transform:translateY(30px);opacity:0;transition:all .8s cubic-bezier(.2,.7,.2,1)}
.phone.show{opacity:1;transform:none}
.phone .inner{width:100%;height:100%;border-radius:40px;background:var(--bg);overflow:hidden;position:relative}
.notch{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:120px;height:28px;background:#0F1117;border-radius:20px;z-index:5}
/* dashboard mock */
.dash{display:flex;width:100%;height:100%;font-size:13px}
.side{width:190px;background:#F7F8FB;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.side .lg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:14px;font-family:Fraunces,Georgia,serif}
.side .lg i{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#E12F3E,#B01824);display:inline-block}
.nav{padding:8px 10px;border-radius:9px;color:var(--mut);font-weight:600;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.nav.on{background:rgba(217,38,50,.1);color:var(--cr)}
.nav b{background:var(--cr);color:#fff;border-radius:10px;font-size:10px;padding:1px 7px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.hdr{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#F7F8FB}
.hdr .t{font-weight:800;font-size:16px}
.hdr .r{display:flex;gap:10px;align-items:center}
.bell{width:32px;height:32px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.bell em{position:absolute;top:-6px;right:-6px;background:var(--cr);color:#fff;border-radius:10px;font-size:10px;font-style:normal;padding:1px 6px;font-weight:700;opacity:0;transform:scale(.5);transition:all .4s cubic-bezier(.2,1.4,.4,1)}
.bell em.show{opacity:1;transform:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--cr);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative}
.av:after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--mint);border:2px solid #F7F8FB}
.body{flex:1;display:flex;min-height:0}
.list{width:250px;border-right:1px solid var(--line);background:#fff;overflow:hidden}
.row{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;transition:background .3s}
.row.sel{background:rgba(217,38,50,.07);border-left:3px solid var(--cr)}
.row .n{display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size:12.5px}
.row .m{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .n,.row.unread .m{font-weight:800;color:var(--ink)}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--cr);display:none}
.row.unread .dot{display:inline-block}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;background:rgba(46,211,167,.15);color:#0E8F6C}
.badge.warn{background:rgba(217,139,11,.15);color:#A66700}
.badge.red{background:rgba(217,38,50,.12);color:var(--cr)}
.chat{flex:1;display:flex;flex-direction:column;background:#fff;min-width:0}
.chat .top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chat .top .nm{font-weight:700;flex:1}
.sw{width:44px;height:24px;border-radius:14px;background:linear-gradient(135deg,var(--mint),#22B58C);position:relative;transition:background .4s}
.sw:after{content:"";position:absolute;top:3px;left:23px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .35s cubic-bezier(.34,1.42,.62,1)}
.sw.off{background:#C9CFDB}.sw.off:after{left:3px}
.swl{font-size:11px;font-weight:700;color:var(--mut)}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px;overflow:hidden;justify-content:flex-end}
.bub{max-width:78%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.45;opacity:0;transform:translateY(12px) scale(.98);transition:all .45s cubic-bezier(.2,.7,.2,1)}
.bub.show{opacity:1;transform:none}
.bub.c{align-self:flex-start;background:#F0F2F7;color:var(--ink);border-bottom-left-radius:4px}
.bub.b{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.you{align-self:flex-end;background:var(--blue);color:#fff}
.bub small{display:block;font-size:10px;opacity:.75;margin-top:3px;text-align:right}
.typing{align-self:flex-end;display:flex;gap:4px;padding:10px 12px;background:#E8EBF2;border-radius:14px;opacity:0;transition:opacity .3s}
.typing.show{opacity:1}.typing.hide{opacity:0}
.typing i{width:7px;height:7px;border-radius:50%;background:#8A90A0;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.inp{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}
.inp span{flex:1;background:#F0F2F7;border-radius:10px;padding:8px 12px}
.inp b{width:30px;height:30px;border-radius:50%;background:var(--blue);display:inline-block}
.pane{flex:1;padding:18px;overflow:hidden}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(20,24,40,.05);opacity:0;transform:translateY(14px);transition:all .5s cubic-bezier(.2,.7,.2,1)}
.card.show{opacity:1;transform:none}
.card h4{font-size:13px;font-weight:800;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line);color:var(--mut)}
.kv b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;background:#F0F2F7;color:var(--mut)}
.chip.ok{background:rgba(46,211,167,.15);color:#0E8F6C}.chip.cr{background:rgba(217,38,50,.12);color:var(--cr)}
.grow{opacity:0;transform:scale(.9);transition:all .5s cubic-bezier(.2,1.2,.3,1)}.grow.show{opacity:1;transform:none}
.fade{opacity:0;transition:opacity .5s ease}.fade.show{opacity:1}
.slide{opacity:0;transform:translateX(24px);transition:all .55s cubic-bezier(.2,.7,.2,1)}.slide.show{opacity:1;transform:none}
/* pricing */
.plans{display:flex;gap:22px}
.plan{flex:1;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 24px;box-shadow:0 20px 50px rgba(20,24,40,.08)}
.plan.pop{border:2px solid var(--cr);position:relative}
.plan .pp{position:absolute;top:-14px;left:24px;background:var(--cr);color:#fff;font-size:12px;font-weight:800;padding:4px 12px;border-radius:12px}
.plan h3{font-size:20px;font-weight:800}
.plan .pr{font-size:38px;font-weight:800;margin:10px 0 4px;letter-spacing:-.02em}
.plan .pr small{font-size:14px;color:var(--mut);font-weight:600}
.plan ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:8px;color:var(--mut);font-size:14px}
.plan li:before{content:"✓";color:#0E8F6C;font-weight:800;margin-right:8px}
/* notif phone */
.push{margin:8px 12px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(20,24,40,.12);display:flex;gap:10px;align-items:flex-start;opacity:0;transform:translateY(-16px);transition:all .5s cubic-bezier(.2,1.2,.3,1)}
.push.show{opacity:1;transform:none}
.push .ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#E12F3E,#B01824);flex-shrink:0}
.push .tx{font-size:13px;line-height:1.35}.push .tx b{display:block;font-size:13px}
.push .tx span{color:var(--mut)}
/* bar chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:120px}
.bars i{flex:1;background:linear-gradient(180deg,var(--cr),var(--deep));border-radius:6px 6px 0 0;height:0;transition:height 1.2s cubic-bezier(.2,.7,.2,1)}
.num{font-size:28px;font-weight:800;letter-spacing:-.02em}
/* hook / outro */
.center{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px}
.biglogo{width:200px;height:200px;border-radius:52px;background:linear-gradient(135deg,#E12F3E,#B01824);box-shadow:0 40px 90px rgba(217,38,50,.35);display:flex;align-items:center;justify-content:center;transform:scale(.6);opacity:0;transition:all .9s cubic-bezier(.2,1.3,.3,1)}
.biglogo.show{transform:none;opacity:1}
.biglogo svg{width:150px;height:150px}
.center .title{max-width:1240px;font-size:70px}
body.bn .center .title{font-size:64px}
.center .sub{max-width:1000px;font-size:28px}
.chips{display:flex;gap:16px;margin-top:10px}
.chips .chip{font-size:18px;padding:12px 22px;background:#fff;box-shadow:0 10px 30px rgba(20,24,40,.08);color:var(--ink)}
.chips .chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.cta{display:inline-block;background:linear-gradient(135deg,#E12F3E,#B01824);color:#fff;font-weight:800;font-size:26px;padding:20px 44px;border-radius:18px;box-shadow:0 20px 50px rgba(217,38,50,.35)}
.site{font-family:Fraunces,Georgia,serif;font-size:44px;font-weight:800;letter-spacing:-.02em}
/* website mock */
.web{width:100%;height:100%;background:#fff;position:relative;overflow:hidden}
.web .nav2{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:12px}
.web .hero{padding:44px 40px;display:flex;gap:30px;align-items:center}
.web .hero h1{font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.web .hero p{color:var(--mut);margin-top:10px;font-size:13px;line-height:1.5}
.web .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 40px}
.web .grid div{height:120px;background:#F0F2F7;border-radius:12px}
.wbub{position:absolute;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#E12F3E,#B01824);box-shadow:0 12px 30px rgba(217,38,50,.4);display:flex;align-items:center;justify-content:center}
.wchat{position:absolute;right:18px;bottom:84px;width:280px;height:330px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(20,24,40,.25);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transform-origin:bottom right}
.wchat .wh{background:var(--cr);color:#fff;padding:12px 14px;font-weight:700;font-size:13px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0F1117;color:#E6E8F0;padding:12px 14px;border-radius:10px;white-space:nowrap;overflow:hidden}
.code em{color:#7CD4FF;font-style:normal}
.wave{display:flex;align-items:center;gap:3px;height:22px}
.wave i{width:4px;background:currentColor;border-radius:3px;animation:wv .9s infinite ease-in-out}
@keyframes wv{0%,100%{height:6px}50%{height:22px}}
.calendar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;font-size:11px}
.calendar .d{background:#F0F2F7;border-radius:8px;padding:6px;height:92px;position:relative}
.calendar .d b{display:block;font-size:11px;margin-bottom:4px;color:var(--mut)}
.calendar .ev{background:#DDE1EA;border-radius:5px;font-size:10px;padding:2px 5px;margin-bottom:3px;color:var(--mut)}
.calendar .ev.new{background:var(--cr);color:#fff;font-weight:700;opacity:0;transform:scale(.8);transition:all .5s cubic-bezier(.2,1.3,.3,1)}
.calendar .ev.new.show{opacity:1;transform:none}
.ph-list{padding:54px 0 0}
.ph-hd{padding:12px 18px;font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.ph-row{padding:12px 18px;border-bottom:1px solid var(--line);background:#fff}
.ph-row .n{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.ph-row .m{color:var(--dim);font-size:12.5px;margin-top:3px}
.ph-row.unread .n,.ph-row.unread .m{font-weight:800;color:var(--ink)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat .card{padding:12px 14px}
.stat .card small{color:var(--mut);font-size:11px;font-weight:600}
.product{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;transition:all .4s}
.product.hit{border-color:var(--cr);background:rgba(217,38,50,.06);box-shadow:0 0 0 3px rgba(217,38,50,.15)}
.product .img{width:44px;height:44px;border-radius:8px;background:#DDE1EA;display:flex;align-items:center;justify-content:center;font-size:22px}
.product .pn{font-weight:700;font-size:12px}.product .pp{color:var(--mut);font-size:11px}
.pic{width:150px;height:110px;border-radius:12px;background:linear-gradient(135deg,#2F3340,#151821);display:flex;align-items:center;justify-content:center;font-size:52px}
.tw{display:inline-block;border-right:2px solid var(--cr);padding-right:2px;white-space:pre-wrap}
</style></head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div id="root"></div>
  <div class="progress"><i id="prog"></i></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const LANG = q.get("lang") || "en", DUR = +(q.get("dur") || 15), ID = q.get("id") || "01-hook";
document.body.classList.add(LANG);
const LOGO = `<svg viewBox="0 0 512 512"><g fill="#fff"><rect x="116" y="110" width="280" height="210" rx="46"/><path d="M160 312 L150 372 L208 315 Z"/></g><g fill="#D92632"><rect x="152" y="185" width="24" height="60" rx="12"/><rect x="198" y="160" width="24" height="110" rx="12"/><rect x="244" y="140" width="24" height="150" rx="12"/><rect x="290" y="160" width="24" height="110" rx="12"/><rect x="336" y="185" width="24" height="60" rx="12"/></g></svg>`;
const T = (en, bn) => LANG === "bn" ? bn : en;
const at = (s, fn) => setTimeout(fn, Math.max(0, s * 1000));
const show = (sel, s) => at(s, () => document.querySelectorAll(sel).forEach(e => e.classList.add("show")));
const cls = (sel, c, s) => at(s, () => document.querySelectorAll(sel).forEach(e => e.classList.add(c)));
const rm = (sel, c, s) => at(s, () => document.querySelectorAll(sel).forEach(e => e.classList.remove(c)));
// Spread N reveal steps across the narration, leaving a lead-in and a tail.
const tl = (n, lead = 1.6, tail = 2.2) => Array.from({ length: n }, (_, i) => lead + (DUR - lead - tail) * (i / Math.max(1, n - 1)));

const NAV = (on) => ["AI Assistant","Channels","Inbox","Comments","Orders","Inventory","Analytics","Broadcast","Bot Training","AI Engine","Billing","Profile"]
  .map(n => `<div class="nav ${n===on?"on":""}">${n}${n==="Inbox"?'<b id="inboxBadge">3</b>':""}</div>`).join("");
const dash = (title, body, on) => `<div class="dash"><div class="side"><div class="lg"><i></i>TellMore AI</div>${NAV(on)}</div>
  <div class="main"><div class="hdr"><span class="t">${title}</span><span class="r"><span class="bell">🔔<em id="bellN">1</em></span><span class="av">BB</span></span></div><div class="body">${body}</div></div></div>`;
const laptop = (inner) => `<div class="right"><div class="laptop"><div class="screen"><div class="inner">${inner}</div></div><div class="base"></div></div></div>`;
const phone = (inner) => `<div class="right"><div class="phone"><div class="inner"><div class="notch"></div>${inner}</div></div></div>`;
const left = (t, s) => `<div class="brand"><span class="ic">${LOGO}</span><span class="name">TellMore AI</span></div>
  <div class="left"><div class="accent"></div><div class="title">${t.split(" ").map(w=>`<span class="w">${w}</span>`).join(" ")}</div><div class="sub">${s}</div></div>`;
const bub = (kind, text, id = "", extra = "") => `<div class="bub ${kind}" ${id ? `id="${id}"` : ""}>${text}${extra}</div>`;
const list = (rows, selIdx) => `<div class="list">${rows.map((r,i)=>`<div class="row ${i===selIdx?"sel":""} ${r.u?"unread":""}" id="r${i}"><div class="n"><span>${r.n}</span><span style="display:flex;gap:6px;align-items:center"><span style="font-size:10px;color:#8A90A0">${r.t}</span><span class="badge ${r.m?"warn":""}">${r.m?"manual":"bot"}</span><span class="dot"></span></span></div><div class="m">${r.p}</div></div>`).join("")}</div>`;

const D = {
  en: { c1: "Ei black baggy ta ki 32 size e ache?", b1: "Yes! Black Baggy Denim is in stock in 30–36. ৳1,290, delivery ৳80 inside Dhaka. Want me to place the order?",
        c2: "Same one, 34 please", b2: "Got it — size 34. Your name and phone number?", c3: "Rafi Ahmed, 01711-XXXXXX", b3: "Address for delivery?", c4: "House 12, Road 5, Dhanmondi",
        b4: "Order confirmed ✅ Code GV-1042 · Black Baggy Denim (34) · ৳1,370 with delivery. We'll message you when it ships.",
        bk1: "Can we meet Tuesday afternoon?", bk2: "Tuesday 4:00 PM is free. Shall I book a 30-minute call?", bk3: "Yes", bk4: "Booked ✅ Tuesday 4:00 PM. Google Meet link: meet.google.com/xyz-abcd. See you then!",

      <div class="wchat grow" id="wc"><div class="wh">Broker's BD · ${T("Chat with us","আমাদের সাথে চ্যাট")}</div><div class="msgs" style="justify-content:flex-start;padding:10px"><div class="bub b show" style="font-size:12px">${T("Hi! Ask me about sizes, prices or delivery.","হাই! সাইজ, দাম বা ডেলিভারি নিয়ে জিজ্ঞেস করুন।")}</div><div class="bub c" id="w1" style="font-size:12px">${T("Do you ship outside Dhaka?","ঢাকার বাইরে পাঠান?")}</div><div class="bub b" id="w2" style="font-size:12px">${T("Yes — anywhere in Bangladesh, ৳130 outside Dhaka, 2–4 days.","জি — সারা বাংলাদেশে, ঢাকার বাইরে ৳১৩০, ২–৪ দিনে।")}</div></div></div><div class="wbub grow" id="wb">${LOGO.replace('viewBox','width="30" height="30" viewBox')}</div></div>`) +
      `<div class="card slide" id="cd" style="position:absolute;left:96px;top:760px;width:700px"><h4>${T("Paste one line into your site","আপনার সাইটে এক লাইন বসান")}</h4><div class="code">&lt;script src="<em>https://www.getvoicium.com/widget.js</em>" data-key="gv_…"&gt;&lt;/script&gt;</div></div>`,
      run() { intro(); show("#cd", 2.0); show("#wb", 3.4); show("#wc", 4.6); show("#w1", 6.2); show("#w2", 7.8); } };

  analytics(sc) {
    const h = [40,55,35,70,90,110,95,120,80,60,45,30];
    return { html: left(sc.title, sc.sub) + laptop(dash("Analytics", `<div class="pane"><div class="stat"><div class="card" id="a1"><small>${T("Conversations · 30 days","কথোপকথন · ৩০ দিন")}</small><div class="num" id="c1">0</div></div><div class="card" id="a2"><small>${T("Answered by the bot","বট উত্তর দিয়েছে")}</small><div class="num" id="c2">0%</div></div><div class="card" id="a3"><small>${T("Orders from chat","চ্যাট থেকে অর্ডার")}</small><div class="num" id="c3">0</div></div></div>
      <div class="card" id="a4"><h4>${T("When customers message","কাস্টমাররা কখন লেখে")}</h4><div class="bars">${h.map((v,i)=>`<i data-h="${v}"></i>`).join("")}</div><div style="display:flex;justify-content:space-between;font-size:10px;color:#8A90A0;margin-top:4px"><span>6am</span><span>12pm</span><span>6pm</span><span>12am</span></div></div>
      <div class="card" id="a5" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><div><h4 style="margin:0">📣 Broadcast</h4><div style="font-size:12px;color:#5B6070">${T("Eid offer → 412 people who wrote in the last 24 h","ঈদ অফার → গত ২৪ ঘণ্টায় লেখা ৪১২ জন")}</div></div><span class="chip cr fade" id="sent">${T("Sent ✓","পাঠানো ✓")}</span></div></div>`, "Analytics")),
      run() { intro(); show("#a1,#a2,#a3", 2.2); count("#c1", 1284, 2.4, 1.8); count("#c2", 92, 2.4, 1.8, "%"); count("#c3", 143, 2.4, 1.8); show("#a4", 4.2); at(4.5,()=>document.querySelectorAll(".bars i").forEach(b=>b.style.height=b.dataset.h+"px")); show("#a5", DUR*.62); show("#sent", DUR*.62+1.5); } };
  },
  pricing(sc) {
    const P = [[T("Starter","Starter"),"1,500",[T("3,000 bot replies / month","মাসে ৩,০০০ বট-উত্তর"),T("1 channel","১টি চ্যানেল"),T("Orders or bookings in chat","চ্যাটে অর্ডার বা বুকিং")]],[T("Growth","Growth"),"3,500",[T("15,000 bot replies / month","মাসে ১৫,০০০ বট-উত্তর"),T("All channels","সব চ্যানেল"),T("Voice notes · Comment automation","ভয়েস নোট · কমেন্ট অটোমেশন"),T("Photo product matching","ছবি দেখে পণ্য মেলানো")]],[T("Scale","Scale"),"6,000",[T("50,000 bot replies / month","মাসে ৫০,০০০ বট-উত্তর"),T("Everything in Growth","Growth-এর সবকিছু"),T("Your own AI key","নিজের AI key"),T("Priority support","অগ্রাধিকার সহায়তা")]]];

  outro(sc) {

      run() { show(".biglogo", .3); words(1.0); show(".site", DUR*.45); show(".cta", DUR*.55); } };

};
function words(start) { document.querySelectorAll(".title .w").forEach((w,i)=>at(start+i*.09,()=>w.classList.add("show"))); }
function intro() { show(".accent", .4); words(.8); show(".sub", 2.0); show(".laptop,.phone", 1.2); }
function count(sel, to, start, dur, suffix="") { at(start, ()=>{ const el=document.querySelector(sel); const t0=performance.now(); const step=()=>{ const p=Math.min(1,(performance.now()-t0)/(dur*1000)); const e=1-Math.pow(1-p,3); el.textContent=Math.round(to*e).toLocaleString()+suffix; if(p<1) requestAnimationFrame(step); }; step(); }); }
function type(sel, text, start, dur) { at(start, ()=>{ const el=document.querySelector(sel); const n=text.length; const t0=performance.now(); const step=()=>{ const p=Math.min(1,(performance.now()-t0)/(dur*1000)); el.textContent=text.slice(0,Math.round(n*p)); if(p<1) requestAnimationFrame(step); }; step(); }); }

fetch("script.json").then(r=>r.json()).then(j=>{
  const sc = j.scenes.find(s=>s.id===ID); const S1 = S[sc.template](sc[LANG]);
  document.getElementById("root").innerHTML = S1.html;
  document.fonts.ready.then(()=>{ requestAnimationFrame(()=>{ document.getElementById("stage").classList.add("in"); S1.run();
    const p=document.getElementById("prog"); const t0=performance.now(); const tick=()=>{ p.style.width=Math.min(100,(performance.now()-t0)/(DUR*1000)*100)+"%"; requestAnimationFrame(tick); }; tick();
    at(DUR-.5, ()=>document.getElementById("stage").classList.remove("in")); window.__ready=true; }); });
});
